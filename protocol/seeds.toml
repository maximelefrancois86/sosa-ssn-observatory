# Seed works of the forward-citation search: a work enters the candidate corpus when it
# cites at least one of them. Identifiers are OpenAlex work IDs; the DOI is given when the
# work has one. `role` says why the seed is there:
#   core      the publications that describe SOSA/SSN, 2017 and 2023
#   lineage   the earlier SSN (Incubator Group, 2009-2012), its design pattern, and the
#             ontology for observations and sampling features whose sampling part became
#             SOSA's
#   variant   another record of a core work (preprint, repository deposit)
# The seed set was fixed on 2026-11-07 (pilotage review/101). Changing it means harvesting
# again, never editing an earlier harvest.

[[seed]]
key = "ssn-xg-report-2011"
openalex = "W2729989548"
role = "lineage"
title = "Semantic Sensor Network XG Final Report"
year = 2011

[[seed]]
key = "sso-2010"
openalex = "W2407444278"
role = "lineage"
title = "The stimulus-sensor-observation ontology design pattern and its integration into the semantic sensor network ontology"
year = 2010

[[seed]]
key = "compton-2012"
openalex = "W2102802363"
doi = "10.1016/j.websem.2012.05.003"
role = "lineage"
title = "The SSN ontology of the W3C semantic sensor network incubator group"
year = 2012

[[seed]]
key = "cox-2017-oosf"
