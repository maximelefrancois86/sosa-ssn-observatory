# Seeds that no citation index holds as a work (W3C Notes and editions published only on
# w3.org), added on 2026-11-14 (Maxime: "another important seed is vocab-ssn-ext"). Neither
# OpenAlex nor Semantic Scholar has a record for them, so their citing works cannot be
# harvested by forward citation: they are found by text instead, by
# scripts/text_seeds.py, which looks for the `strings` of each seed (title, URL,
# namespace) in the full texts held, bibliography included, and asks the OpenAlex
# full-text search for the same strings. They are read by that script only, not by
# load_seeds(): the strata A to C keep their definition.

[[text_seed]]
key = "cox-2020-ssn-ext"
role = "core"
title = "Extensions to the Semantic Sensor Network Ontology (W3C Working Draft / Note)"
year = 2020
url = "https://www.w3.org/TR/vocab-ssn-ext/"
strings = ["vocab-ssn-ext", "Extensions to the Semantic Sensor Network Ontology",
           "w3.org/ns/ssn/ext", "ssn-ext:"]   # the ontology is at ns/ssn/ext/, its terms are in sosa:; ssn-ext: is a prefix some works write

[[text_seed]]
key = "w3c-ssn-2023"
role = "core"
title = "Semantic Sensor Network Ontology, 2023 Edition (W3C drafts)"
year = 2023
url = "https://www.w3.org/TR/vocab-ssn-2023/"
strings = ["vocab-ssn-2023"]
