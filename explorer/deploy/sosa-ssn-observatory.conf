# ci.mines-stetienne.fr: the SOSA/SSN Usage Observatory (slr/explorer/ of the SOSA/SSN review),
# served by its container (deploy/compose.yaml, 127.0.0.1:8115) under /sosa-ssn-observatory/.
# Installed as /etc/apache2/sites-available/sosa-ssn-observatory.conf and enabled with
# `a2ensite sosa-ssn-observatory` (modules: proxy, proxy_http, headers, alias).

<IfModule mod_proxy.c>
  <Location "/sosa-ssn-observatory/">
    ProxyPass        http://127.0.0.1:8115/
    ProxyPassReverse http://127.0.0.1:8115/
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Prefix "/sosa-ssn-observatory"
  </Location>
  RedirectMatch 301 "^/sosa-ssn-observatory$" "/sosa-ssn-observatory/"
  # its first address (2026-11-14, a static alias)
  RedirectMatch 301 "^/research/sosa-ssn-observatory(/.*)?$" "/sosa-ssn-observatory$1"
</IfModule>

# Sanity check after reloading Apache:
#   curl -sI https://ci.mines-stetienne.fr/sosa-ssn-observatory/ | head -1          # 200
#   curl -s  https://ci.mines-stetienne.fr/sosa-ssn-observatory/healthz            # ok
